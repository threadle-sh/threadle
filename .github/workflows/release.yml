name: Release

# Tags may be X.Y.Z or vX.Y.Z (must match the `threadle` workspace version).
#
# Immutable releases are enabled on this repo: publishing a release seals its
# assets and locks its tag forever. So this workflow builds a DRAFT release,
# attaches every asset, publishes to npm, and only then flips the draft to
# published. A draft is still mutable and its tag is still deletable, so any
# failure before the final step is fully recoverable: delete the draft, delete
# the tag, fix, re-tag the same version.
#
# workflow_dispatch can only resume a run that died before the draft was
# published. It CANNOT repair an already-published release — nothing can.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. 0.9.0 or v0.9.0)"
        required: true
        type: string

permissions:
  contents: write # create the release, upload assets
  id-token: write # npm trusted publishing (OIDC) + provenance

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # If you put the publish behind a GitHub environment for manual approval,
    # uncomment this AND add the same environment name to the npm Trusted
    # Publisher config — otherwise the OIDC claim won't match and npm 404s.
    # environment: release

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          [[ -n "$TAG" ]] || { echo "::error::empty tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7 # TODO: pin to a full commit SHA
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v7 # TODO: pin to a full commit SHA
        with:
          node-version: "26"
          cache: npm
          registry-url: https://registry.npmjs.org

      # ---------------------------------------------------------------- guards
      # Everything that can fail cheaply fails here, before we build anything
      # or touch the registry.

      - name: Refuse to touch an already-published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --json isDraft -q .isDraft >/tmp/isdraft 2>/dev/null; then
            if [[ "$(cat /tmp/isdraft)" == "false" ]]; then
              echo "::error::Release $TAG is already published and therefore immutable."
              echo "::error::Its assets and tag cannot be changed. Ship the next patch version instead."
              exit 1
            fi
            echo "A draft for $TAG exists — it will be replaced."
          else
            echo "No existing release for $TAG."
          fi

      - name: Verify tag matches the published package version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Read the version from whatever workspace `threadle` actually resolves
          # to, not from a hardcoded path — those can drift apart.
          V=$(npm pkg get version -w threadle \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const o=JSON.parse(s);process.stdout.write(typeof o==='string'?o:Object.values(o)[0])})")
          V="${V//\"/}"
          TAG_V="${{ steps.meta.outputs.version }}"
          if [[ "$TAG_V" != "$V" ]]; then
            echo "::error::tag ${{ steps.meta.outputs.tag }} does not match threadle version $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing threadle $V"

      - name: Refuse to republish an existing npm version
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if npm view "threadle@$V" version >/dev/null 2>&1; then
            echo "::error::threadle@$V is already on npm. npm versions are immutable — bump and re-tag."
            exit 1
          fi
          echo "threadle@$V is free on npm."

      # ----------------------------------------------------------------- build

      - name: Build portable artifacts (all platforms)
        run: bash scripts/release-artifacts.sh

      - name: Verify artifacts exist
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/portable/threadle-*.tar.gz dist/portable/SHA256SUMS)
          if (( ${#FILES[@]} < 2 )); then
            echo "::error::expected tarballs + SHA256SUMS in dist/portable, found ${#FILES[@]} file(s)"
            ls -la dist/portable || true
            exit 1
          fi
          printf '%s\n' "${FILES[@]}"

      # ------------------------------------------------------- draft → npm → publish

      - name: Create draft release with all assets attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # A leftover draft from a failed run would collide; drafts are deletable.
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "threadle ${{ steps.ver.outputs.version }}" \
            dist/portable/threadle-*.tar.gz \
            dist/portable/SHA256SUMS
          echo "draft created for $TAG"

      - name: Stage README into the published package
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR=packages/server
          NAME=$(node -p "require('./$PKG_DIR/package.json').name")
          [[ "$NAME" == "threadle" ]] || {
            echo "::error::$PKG_DIR is '$NAME', not threadle — update PKG_DIR"
            exit 1
          }
          cp README.md "$PKG_DIR/README.md"
          TAG="${{ steps.meta.outputs.tag }}"
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${TAG}"
          perl -i -pe 's#src="((?:images|docs)/[^"]+)"#src="'"$RAW"'/$1"#g' \
            "$PKG_DIR/README.md"
          if grep -qE 'src="(images|docs)/' "$PKG_DIR/README.md"; then
            echo "::error::relative image src(s) still present after rewrite"
            grep -nE 'src="(images|docs)/' "$PKG_DIR/README.md" || true
            exit 1
          fi
          grep -q "src=\"${RAW}/" "$PKG_DIR/README.md" || {
            echo "::error::expected rewritten absolute image URLs in staged README"
            exit 1
          }
          npm pack -w threadle --dry-run 2>&1 | grep -qi 'README.md' || {
            echo "::error::README.md is still missing from the tarball"
            exit 1
          }
          echo "README staged into $PKG_DIR (images → $RAW/…)"

      - name: Publish to npm (trusted publishing, no token)
        shell: bash
        run: npm publish -w threadle --access public --provenance

      - name: Seal the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG — assets and tag are now immutable"

      # ---------------------------------------------------------------- cleanup

      - name: Roll back the draft on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if [[ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" == "true" ]]; then
            gh release delete "$TAG" --yes --cleanup-tag=false
            echo "::notice::Deleted the draft for $TAG. The tag still exists and is not yet immutable."
            echo "::notice::To retry the same version: git push --delete origin $TAG && git tag -d $TAG"
          fi