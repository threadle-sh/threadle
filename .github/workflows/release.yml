name: Release

# Tags may be X.Y.Z or vX.Y.Z (must match packages/server version).
# workflow_dispatch re-runs publish + asset upload for an existing tag
# (e.g. after fixing a broken 0.9.0 release).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. 0.9.0 or v0.9.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          [[ -n "$TAG" ]] || { echo "::error::empty tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Build portable artifacts (all platforms)
        run: bash scripts/release-artifacts.sh

      - name: Verify version matches tag
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./packages/server/package.json').version")
          TAG="${{ steps.meta.outputs.tag }}"
          TAG_V="${TAG#v}"
          if [[ "$TAG_V" != "$V" ]]; then
            echo "::error::tag $TAG does not match package.json version $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: threadle ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/portable/threadle-*.tar.gz
            dist/portable/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm
        shell: bash
        env:
          # Only set when present — an empty NODE_AUTH_TOKEN breaks OIDC
          # trusted publishing. Prefer Automation token (NPM_TOKEN) or
          # configure Trusted Publisher on npm for this workflow.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm publish -w threadle --access public --provenance
