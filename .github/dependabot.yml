# Dependabot — npm workspace + GitHub Actions.
# Not a substitute for provider CLI watch (see provider-watch.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 8
    labels:
      - dependencies
    groups:
      npm-patch-minor:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    labels:
      - dependencies
    commit-message:
      prefix: ci
